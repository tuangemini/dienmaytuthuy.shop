<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%">
  <defs>
    <linearGradient id="dkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="dkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F4C81" />
    </linearGradient>
    <filter id="dkShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F4C81" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Logo Emblem: Geometric Hexagon Shield with ĐK & 36 -->
  <g transform="translate(10, 5)">
    <!-- Outer Shield Hexagon -->
    <path d="M48 6 L84 25 L84 67 L48 88 L12 67 L12 25 Z" fill="url(#dkBlue)" filter="url(#dkShadow)" />
    
    <!-- Inner Accent Diamond -->
    <path d="M48 14 L76 30 L76 63 L48 80 L20 63 L20 30 Z" fill="none" stroke="url(#dkGold)" stroke-width="2.5" />
    
    <!-- Stylized "ĐK" and "36" Monogram -->
    <text x="48" y="47" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">ĐK</text>
    <text x="48" y="70" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="16" fill="url(#dkGold)" text-anchor="middle" letter-spacing="1.5">36</text>
  </g>

  <!-- Typography Brand Text -->
  <g transform="translate(112, 18)">
    <!-- Subtitle: CÔNG TY TNHH -->
    <text x="0" y="16" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="12" fill="#64748B" letter-spacing="1.8" text-transform="uppercase">
      CÔNG TY TNHH
    </text>
    
    <!-- Main Title: ĐỖ KIÊN 36 -->
    <text x="0" y="48" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="34" fill="#0F4C81" letter-spacing="-0.5">
      ĐỖ KIÊN <tspan fill="url(#dkGold)">36</tspan>
    </text>
    
    <!-- Slogan / Activity -->
    <text x="0" y="72" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="11.5" fill="#475569" letter-spacing="0.8">
      TỔNG KHO PHÂN PHỐI SỈ &amp; LẺ • QUÀ TẶNG DOANH NGHIỆP
    </text>
  </g>
</svg>
